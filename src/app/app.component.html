<p *ngIf="!isonline">Please Connect to BSYFI-6789</p>
<main *ngIf="isonline">
  <h6>{{date.toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}}</h6>
  <h3>{{date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}}</h3>
  <!-- For Component View -->
  <div id="meetingSDKElement">
    <!-- Zoom Meeting SDK Component View Rendered Here -->
  </div>
  <div *ngIf="meetingSoon" class="count-down-timer">
    <p>Joining Meeting</p>
    <div class="wrapper">
      <div class="description">
        <p>Minutes</p>
        <p>Seconds</p>
      </div>
      <div class="times">
        <p #minutes></p>
        <p #seconds></p>
      </div>
    </div>
  </div>
  <mwl-calendar-day-view [viewDate]="viewDate" [events]="events" [dayStartHour]="7" [dayEndHour]="20">
  </mwl-calendar-day-view>

  <div *ngFor="let m of meetings">
    {{m.topic}} - {{m.start_time}}
    <button (click)="getSignature()">Join {{m.id}}</button>
  </div>
</main>
